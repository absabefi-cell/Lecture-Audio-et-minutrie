name: Construire AAB Lecteur Audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Installer Cordova
        run: npm install -g cordova@12.0.0

      - name: Creer le projet Android
        run: |
          cordova create "$RUNNER_TEMP/lecteur-audio" \
            com.absabefi.lecteuraudio \
            "Lecteur Audio"

      - name: Copier les fichiers du lecteur
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"])
          target = Path(os.environ["RUNNER_TEMP"]) / "lecteur-audio" / "www"

          shutil.rmtree(target)
          target.mkdir(parents=True)

          excluded = {
              ".git", ".github", "node_modules",
              "platforms", "plugins"
          }

          for item in source.iterdir():
              if item.name in excluded:
                  continue

              destination = target / item.name

              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)

          if not (target / "index.html").is_file():
              raise SystemExit(
                  "Le fichier index.html manque a la racine du depot."
              )

      - name: Configurer le lecteur
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "lecteur-audio"
              / "config.xml"
          )

          ns = "http://www.w3.org/ns/widgets"
          ET.register_namespace("", ns)
          ET.register_namespace(
              "cdv",
              "http://cordova.apache.org/ns/1.0"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          root.set("id", "com.absabefi.lecteuraudio")
          root.set("version", "1.0.0")
          root.set("android-versionCode", "1")

          content = root.find(f"{{{ns}}}content")
          if content is None:
              content = ET.SubElement(
                  root, f"{{{ns}}}content"
              )
          content.set("src", "index.html")

          for element in list(root):
              if element.tag == f"{{{ns}}}access":
                  root.remove(element)

          ET.SubElement(
              root,
              f"{{{ns}}}access",
              {"origin": "*"}
          )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

      - name: Ajouter Android
        working-directory: ${{ runner.temp }}/lecteur-audio
        run: cordova platform add android@14.0.1

      - name: Construire le AAB non signe
        working-directory: ${{ runner.temp }}/lecteur-audio
        run: cordova build android --release -- --packageType=bundle

      - name: Recuperer le AAB
        shell: bash
        run: |
          AAB_PATH="$RUNNER_TEMP/lecteur-audio/platforms/android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "Erreur : fichier AAB introuvable."
            exit 1
          fi

          cp "$AAB_PATH" \
            "$GITHUB_WORKSPACE/Lecteur-Audio-non-signe.aab"

      - name: Telecharger le AAB
        uses: actions/upload-artifact@v4
        with:
          name: lecteur-audio-AAB-non-signe
          path: Lecteur-Audio-non-signe.aab
          if-no-files-found: error
          retention-days: 14
